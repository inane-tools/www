<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="silver" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fafafa"/>
      <stop offset="55%" stop-color="#d4d4d8"/>
      <stop offset="85%" stop-color="#e7e7ea"/>
      <stop offset="100%" stop-color="#a1a1aa"/>
    </radialGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.5"/>
      <stop offset="45%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.25"/>
    </linearGradient>
  </defs>

  <!-- Copy this file to <app-slug>.svg (e.g. vibepad.svg) or default.svg
       inside public/discs/ and replace the artwork with your own.
       Square art works best; the disc face samples the inscribed circle. -->

  <!-- base -->
  <circle cx="256" cy="256" r="256" fill="url(#silver)"/>

  <!-- machined rings -->
  <g fill="none" stroke="#71717a" stroke-opacity="0.25" stroke-width="2">
    <circle cx="256" cy="256" r="82"/>
    <circle cx="256" cy="256" r="106"/>
    <circle cx="256" cy="256" r="130"/>
    <circle cx="256" cy="256" r="154"/>
    <circle cx="256" cy="256" r="178"/>
    <circle cx="256" cy="256" r="202"/>
    <circle cx="256" cy="256" r="226"/>
  </g>

  <!-- put your label ring / artwork here -->
  <circle cx="256" cy="256" r="168" fill="none" stroke="#fafafa" stroke-opacity="0.8" stroke-width="3"/>

  <!-- light sheen -->
  <circle cx="256" cy="256" r="256" fill="url(#sheen)"/>

  <!-- hub hole -->
  <circle cx="256" cy="256" r="48" fill="#09090b"/>
  <circle cx="256" cy="256" r="48" fill="none" stroke="#52525b" stroke-width="4"/>
</svg>
